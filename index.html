<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de Preços</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f6f8fa;
            margin: 0;
            padding: 40px 20px;
            color: #24292e;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 28px;
            margin: 0 0 8px 0;
            color: #1f2328;
        }
        .header p {
            font-size: 14px;
            color: #636c76;
            margin: 0;
        }
        .container {
            display: flex;
            gap: 24px;
            width: 100%;
            max-width: 1000px;
            justify-content: center;
        }
        .card {
            background: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            padding: 24px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 1px 3px rgba(31,35,40,0.04);
            box-sizing: border-box;
        }
        .card h2 {
            font-size: 18px;
            margin: 0 0 20px 0;
            color: #1f2328;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #57606a;
            text-transform: uppercase;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            background-color: #f6f8fa;
            color: #24292e;
            box-sizing: border-box;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .form-group input:focus {
            background-color: #ffffff;
            border-color: #0969da;
            outline: none;
            box-shadow: 0 0 0 3px rgba(9,105,218,0.15);
        }
        .btn-buscar {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s;
            margin-top: 20px;
        }
        .btn-buscar:hover {
            background-color: #357abd;
        }
        .resultados-container {
            margin-top: 20px;
            border-top: 1px solid #d0d7de;
            padding-top: 16px;
            display: none;
        }
        .busca-vazia {
            color: #636c76;
            font-size: 14px;
            margin: 0;
        }
        .tabela-resultados {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .tabela-resultados th {
            text-align: left;
            padding-bottom: 8px;
            color: #57606a;
            border-bottom: 2px solid #d0d7de;
            font-weight: 600;
        }
        .tabela-resultados td {
            padding: 10px 0;
            border-bottom: 1px solid #f6f8fa;
            vertical-align: top;
        }
        .item-nome {
            font-weight: 600;
            color: #1f2328;
        }
        .item-sub {
            font-size: 12px;
            color: #636c76;
            margin-top: 2px;
        }
        .item-preco {
            text-align: right;
            font-weight: 600;
            color: #1a7f37;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Comparador de Preços</h1>
        <p>Preencha os campos e utilize o botão Buscar ou a tecla Enter</p>
    </div>

    <div class="container">
        <!-- PESQUISA OPÇÃO A -->
        <div class="card">
            <h2>Pesquisa Opção A</h2>
            <div class="form-group">
                <label>Estabelecimento</label>
                <input type="text" id="est-a" placeholder="Selecione ou digite..." autocomplete="off">
            </div>
            <div class="form-group">
                <label>Produto</label>
                <input type="text" id="prod-a" placeholder="Selecione ou digite..." autocomplete="off">
            </div>
            <button class="btn-buscar" onclick="realizarBusca('A')">Buscar</button>
            
            <div id="res-container-a" class="resultados-container"></div>
        </div>

        <!-- PESQUISA OPÇÃO B -->
        <div class="card">
            <h2>Pesquisa Opção B</h2>
            <div class="form-group">
                <label>Estabelecimento</label>
                <input type="text" id="est-b" placeholder="Selecione ou digite..." autocomplete="off">
            </div>
            <div class="form-group">
                <label>Produto</label>
                <input type="text" id="prod-b" placeholder="Selecione ou digite..." autocomplete="off">
            </div>
            <button class="btn-buscar" onclick="realizarBusca('B')">Buscar</button>
            
            <div id="res-container-b" class="resultados-container"></div>
        </div>
    </div>

    <script>
        let bancoDados = [];

        // Inicialização automática ao carregar o site
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const resposta = await fetch('dados.json');
                bancoDados = await resposta.json();
                configurarSugestoes();
                configurarEnter();
            } catch (erro) {
                console.error("Erro crítico ao ler o arquivo dados.json:", erro);
            }
        });

        // Configura as opções suspensas (Datalist) nos campos
        function configurarSugestoes() {
            const mercadosUnicos = [...new Set(bancoDados.map(d => d.estabelecimento))].sort();
            const produtosUnicos = [...new Set(bancoDados.map(d => d.produto))].sort();

            criarDatalistElemento("lista-geral-mercados", mercadosUnicos);
            criarDatalistElemento("lista-geral-produtos", produtosUnicos);

            document.getElementById("est-a").setAttribute("list", "lista-geral-mercados");
            document.getElementById("est-b").setAttribute("list", "lista-geral-mercados");
            document.getElementById("prod-a").setAttribute("list", "lista-geral-produtos");
            document.getElementById("prod-b").setAttribute("list", "lista-geral-produtos");
        }

        function criarDatalistElemento(id, itens) {
            const datalist = document.createElement("datalist");
            datalist.id = id;
            datalist.innerHTML = itens.map(i => `<option value="${i}"></option>`).join("");
            document.body.appendChild(datalist);
        }

        // Permite buscar usando a tecla Enter dentro dos inputs
        function configurarEnter() {
            ['a', 'b'].forEach(bloco => {
                document.getElementById(`est-${bloco}`).addEventListener("keypress", (e) => {
                    if (e.key === "Enter") realizarBusca(bloco.toUpperCase());
                });
                document.getElementById(`prod-${bloco}`).addEventListener("keypress", (e) => {
                    if (e.key === "Enter") realizarBusca(bloco.toUpperCase());
                });
            });
        }

        // Executa o filtro de busca inteligente e mostra na tela
        function realizarBusca(opcao) {
            const sufixo = opcao.toLowerCase();
            const termoMercado = document.getElementById(`est-${sufixo}`).value.trim().toLowerCase();
            const termoProduto = document.getElementById(`prod-${sufixo}`).value.trim().toLowerCase();
            const containerResultado = document.getElementById(`res-container-${sufixo}`);

            // Filtra os dados combinando mercado e produto se preenchidos
            const filtrados = bancoDados.filter(item => {
                const bateMercado = termoMercado === "" || item.estabelecimento.toLowerCase().includes(termoMercado);
                const bateProduto = termoProduto === "" || item.produto.toLowerCase().includes(termoProduto);
                return bateMercado && bateProduto;
            });

            containerResultado.style.display = "block";

            if (filtrados.length === 0) {
                containerResultado.innerHTML = `<p class="busca-vazia">❌ Nenhum resultado encontrado.</p>`;
                return;
            }

            let htmlTabela = `
                <table class="tabela-resultados">
                    <thead>
                        <tr>
                            <th>Supermercado / Item</th>
                            <th style="text-align: right;">Preço</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            filtrados.forEach(item => {
                const dataBR = item.data.split('-').reverse().join('/');
                htmlTabela += `
                    <tr>
                        <td>
                            <div class="item-nome">${item.estabelecimento}</div>
                            <div class="item-sub">${item.produto} (Coleta: ${dataBR})</div>
                        </td>
                        <td class="item-preco">R$ ${item.preco.toFixed(2).replace('.', ',')}</td>
                    </tr>
                `;
            });

            htmlTabela += `</tbody></table>`;
            containerResultado.innerHTML = htmlTabela;
        }
    </script>
</body>
</html>
