<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de Preços</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #1e3d59;
            margin-bottom: 30px;
        }
        .comparador-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .comparador-grid {
                grid-template-columns: 1fr;
            }
        }
        .painel-pesquisa {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 5px solid #17a2b8;
        }
        .painel-pesquisa.opcao-b {
            border-top-color: #007bff;
        }
        .painel-pesquisa h2 {
            margin-top: 0;
            color: #1e3d59;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 10px;
        }
        .campo-grupo {
            margin-bottom: 15px;
        }
        .campo-grupo label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9em;
        }
        .campo-grupo select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            background-color: #fff;
            font-size: 1em;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 20px;
        }
        .btn-a { background: #17a2b8; color: white; }
        .btn-a:hover { background: #138496; }
        .btn-b { background: #007bff; color: white; }
        .btn-b:hover { background: #0069d9; }
        .btn-limpar {
            background: #6c757d;
            color: white;
            padding: 6px 12px;
            font-size: 0.85em;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-limpar:hover { background: #5a6268; }
        
        .tabela-resultados {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .tabela-resultados th, .tabela-resultados td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
            font-size: 0.95em;
        }
        .tabela-resultados th {
            background-color: #f8f9fa;
            color: #495057;
        }
        .btn-remover {
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            font-weight: bold;
        }
        .container-total {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .valor-total {
            font-size: 1.3em;
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🛒 Comparador de Preços</h1>

    <div class="comparador-grid">
        <!-- COLUNA OPÇÃO A -->
        <div class="painel-pesquisa">
            <h2>Pesquisa Opção A</h2>
            
            <div class="campo-grupo">
                <label for="estabelecimento-a">Estabelecimento</label>
                <select id="estabelecimento-a" onchange="atualizarProdutosDisponiveis('A')">
                    <option value="">Selecione um estabelecimento...</option>
                </select>
            </div>
            
            <div class="campo-grupo">
                <label for="produto-a">Produto</label>
                <select id="produto-a">
                    <option value="">Selecione um produto...</option>
                </select>
            </div>
            
            <button class="btn btn-a" onclick="adicionarItem('A')">＋ Adicionar à Lista A</button>

            <h3>Produtos na Lista A</h3>
            <table class="tabela-resultados" id="tabela-a">
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Preço</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="lista-itens-a">
                    <tr>
                        <td colspan="3" style="color: #666; text-align: center;">Nenhum produto adicionado.</td>
                    </tr>
                </tbody>
            </table>

            <div class="container-total">
                <span>TOTAL DA LISTA A:</span>
                <span class="valor-total" id="total-a">R$ 0,00</span>
            </div>
            <button class="btn-limpar" onclick="limparLista('A')">Limpar Lista A</button>
        </div>

        <!-- COLUNA OPÇÃO B -->
        <div class="painel-pesquisa opcao-b">
            <h2>Pesquisa Opção B</h2>
            
            <div class="campo-grupo">
                <label for="estabelecimento-b">Estabelecimento</label>
                <select id="estabelecimento-b" onchange="atualizarProdutosDisponiveis('B')">
                    <option value="">Selecione um estabelecimento...</option>
                </select>
            </div>

            <div class="campo-grupo">
                <label for="produto-b">Produto</label>
                <select id="produto-b">
                    <option value="">Selecione um produto...</option>
                </select>
            </div>
            
            <button class="btn btn-b" onclick="adicionarItem('B')">＋ Adicionar à Lista B</button>

            <h3>Produtos na Lista B</h3>
            <table class="tabela-resultados" id="tabela-b">
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Preço</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="lista-itens-b">
                    <tr>
                        <td colspan="3" style="color: #666; text-align: center;">Nenhum produto adicionado.</td>
                    </tr>
                </tbody>
            </table>

            <div class="container-total">
                <span>TOTAL DA LISTA B:</span>
                <span class="valor-total" id="total-b">R$ 0,00</span>
            </div>
            <button class="btn-limpar" onclick="limparLista('B')">Limpar Lista B</button>
        </div>
    </div>
</div>
