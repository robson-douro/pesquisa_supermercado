<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de Preços</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #212529;
            --text-muted: #6c757d;
            --accent: #4a90e2;
            --accent-hover: #357abd;
            --border-color: #e9ecef;
            --alert-bg: #fff5f5;
            --alert-text: #e53e3e;
            --alert-border: #fed7d7;
            --price-color: #2f855a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 30px 15px;
            line-height: 1.5;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 15px;
            margin-top: 5px;
        }

        .comparison-container {
            display: flex;
            gap: 20px;
            width: 100%;
            margin: 0 auto;
        }

        .search-column {
            flex: 1;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .search-column h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-main);
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
        }

        .search-inputs {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            background-color: var(--card-bg);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .btn-search {
            width: 100%;
            padding: 10px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 5px;
        }

        .btn-search:hover {
            background-color: var(--accent-hover);
        }

        .results {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-card {
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            background-color: var(--card-bg);
            position: relative;
        }

        .product-card .store-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .product-card .product-name {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .product-card .price-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 8px;
        }

        .product-card .price {
            font-size: 20px;
            color: var(--price-color);
            font-weight: 700;
        }

        .product-card .date {
            font-size: 12px;
            color: var(--text-muted);
        }

        .alert-outdated {
            margin-top: 10px;
            color: var(--alert-text);
            background-color: var(--alert-bg);
            border: 1px solid var(--alert-border);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }

        .admin-section {
            width: 100%;
            margin-top: 30px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .admin-section h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .admin-section p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            align-items: flex-end;
        }

        .btn-admin {
            padding: 12px 20px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: background-color 0.2s ease;
            height: 46px;
            width: 100%;
        }

        .btn-admin:hover {
            background-color: var(--accent-hover);
        }

        .output-box {
            margin-top: 20px;
        }

        .output-box input {
            background-color: var(--bg-color);
            cursor: pointer;
            font-family: monospace;
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .comparison-container {
                flex-direction: column;
            }
            body {
                padding: 15px 10px;
            }
        }
    </style>
</head>
<body>

    <datalist id="listaEstabelecimentos"></datalist>
    <datalist id="listaProdutos"></datalist>

    <div class="header">
        <h1>Comparador de Preços</h1>
        <p>Preencha os campos e utilize o botão Buscar ou a tecla Enter</p>
    </div>
    
    <div class="comparison-container">
        <!-- Opção A -->
        <div class="search-column">
            <h2>Pesquisa Opção A</h2>
            <form onsubmit="buscarA(event)">
                <div class="search-inputs">
                    <div class="form-group">
                        <label for="estabA">Estabelecimento</label>
                        <input type="text" id="estabA" list="listaEstabelecimentos" placeholder="Selecione ou digite..." autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="prodA">Produto</label>
                        <input type="text" id="prodA" list="listaProdutos" placeholder="Selecione ou digite..." autocomplete="off">
                    </div>
                    <button type="submit" class="btn-search">Buscar</button>
                </div>
            </form>
            <div class="results" id="resultadosA"></div>
        </div>

        <!-- Opção B -->
        <div class="search-column">
            <h2>Pesquisa Opção B</h2>
            <form onsubmit="buscarB(event)">
                <div class="search-inputs">
                    <div class="form-group">
                        <label for="estabB">Estabelecimento</label>
                        <input type="text" id="estabB" list="listaEstabelecimentos" placeholder="Selecione ou digite..." autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="prodB">Produto</label>
                        <input type="text" id="prodB" list="listaProdutos" placeholder="Selecione ou digite..." autocomplete="off">
                    </div>
                    <button type="submit" class="btn-search">Buscar</button>
                </div>
            </form>
            <div class="results" id="resultadosB"></div>
        </div>
    </div>

    <!-- Área de Cadastro -->
    <div class="admin-section">
        <h2>Adicionar Novo Preço</h2>
        <p>Preencha os campos para gerar a estrutura de dados e atualizar o seu repositório.</p>
        
        <form id="cadastroForm" onsubmit="gerarJSON(event)">
            <div class="admin-grid">
                <div class="form-group">
                    <label>Estabelecimento</label>
                    <input type="text" id="cadEstab" list="listaEstabelecimentos" required placeholder="Nome do local">
                </div>
                <div class="form-group">
                    <label>Produto</label>
                    <input type="text" id="cadProd" list="listaProdutos" required placeholder="Nome do produto">
                </div>
                <div class="form-group">
                    <label>Preço (R$)</label>
                    <input type="number" step="0.01" id="cadPreco" required placeholder="0,00">
                </div>
                <div class="form-group">
                    <label>Data da Coleta</label>
                    <input type="date" id="cadData" required>
                </div>
                <button type="submit" class="btn-admin">Gerar Registro</button>
            </div>
        </form>
        <!-- CÓDIGO DE CORREÇÃO DO COMPARADOR (COLE ANTES DE </body >) -->
<script>
let dadosPrecos = [];

// 1. Carrega os dados do arquivo dados.json automaticamente
document.addEventListener("DOMContentLoaded", async () => {
    try {
        const response = await fetch('dados.json');
        dadosPrecos = await response.json();
        
        preencherListasSuspensus();
        ativarBotoesEEnter();
    } catch (error) {
        console.error("Erro ao ler o arquivo dados.json:", error);
    }
});

// 2. Cria as opções automáticas para clicar e selecionar nos campos
function preencherListasSuspensus() {
    const mercados = [...new Set(dadosPrecos.map(item => item.estabelecimento))].sort();
    const produtos = [...new Set(dadosPrecos.map(item => item.produto))].sort();

    criarDatalistHtml("lista-mercados", mercados);
    criarDatalistHtml("lista-produtos", produtos);

    // Procura todos os inputs da página
    const inputs = document.querySelectorAll("input");
    
    // Vincula as listas de sugestão aos campos com base na ordem que aparecem na tela
    if (inputs.length >= 4) {
        inputs[0].setAttribute("list", "lista-mercados"); // Opção A - Estabelecimento
        inputs[1].setAttribute("list", "lista-produtos"); // Opção A - Produto
        inputs[2].setAttribute("list", "lista-mercados"); // Opção B - Estabelecimento
        inputs[3].setAttribute("list", "lista-produtos"); // Opção B - Produto
    } else {
        // Caso seu HTML tenha uma estrutura diferente, tenta adivinhar pelo texto próximo
        inputs.forEach(input => {
            const textoAnterior = input.previousElementSibling?.textContent.toLowerCase() || "";
            if (textoAnterior.includes("estabelecimento")) input.setAttribute("list", "lista-mercados");
            if (textoAnterior.includes("produto")) input.setAttribute("list", "lista-produtos");
        });
    }
}

function criarDatalistHtml(id, itens) {
    let datalist = document.getElementById(id);
    if (!datalist) {
        datalist = document.createElement("datalist");
        datalist.id = id;
        document.body.appendChild(datalist);
    }
    datalist.innerHTML = itens.map(item => `<option value="${item}"></option>`).join("");
}

// 3. Faz o botão Buscar e a tecla Enter funcionarem
function ativarBotoesEEnter() {
    // Procura por botões que tenham o texto "Buscar"
    const botoes = Array.from(document.querySelectorAll("button, a, div")).filter(el => 
        el.textContent.trim().toLowerCase() === "buscar"
    );

    botoes.forEach((botao, index) => {
        botao.style.cursor = "pointer"; // Garante que mostre a mãozinha do mouse
        botao.addEventListener("click", (e) => {
            e.preventDefault();
            dispararPesquisa(index === 0 ? 'A' : 'B');
        });
    });

    // Ativa o Enter nos campos de texto
    const inputs = document.querySelectorAll("input");
    inputs.forEach((input, index) => {
        input.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                dispararPesquisa(index < 2 ? 'A' : 'B');
            }
        });
    });
}

// 4. Executa o filtro de busca
function dispararPesquisa(bloco) {
    const inputs = document.querySelectorAll("input");
    let mercadoProcurado = "";
    let produtoProcurado = "";

    if (inputs.length >= 4) {
        mercadoProcurado = bloco === 'A' ? inputs[0].value.trim() : inputs[2].value.trim();
        produtoProcurado = bloco === 'A' ? inputs[1].value.trim() : inputs[3].value.trim();
    } else {
        return; // Evita quebrar se o HTML estiver muito diferente
    }

    // Filtra no banco de dados JSON
    const resultados = dadosPrecos.filter(item => {
        const bateMercado = mercadoProcurado === "" || item.estabelecimento.toLowerCase().includes(mercadoProcurado.toLowerCase());
        const bateProduto = produtoProcurado === "" || item.produto.toLowerCase().includes(produtoProcurado.toLowerCase());
        return bateMercado && bateProduto;
    });

    renderizarResultadosNaTela(bloco, resultados);
}

// 5. Mostra os preços formatados na tela logo abaixo do respectivo bloco
function renderizarResultadosNaTela(bloco, lista) {
    // Encontra os blocos visuais de pesquisa baseados nos botões Buscar
    const botoes = Array.from(document.querySelectorAll("button, a, div")).filter(el => 
        el.textContent.trim().toLowerCase() === "buscar"
    );
    
    const botaoAlvo = bloco === 'A' ? botoes[0] : botoes[1];
    if (!botaoAlvo) return;

    // Remove o resultado da busca anterior para não acumular na tela
    const containerPai = botaoAlvo.parentElement;
    const resultadoAntigo = containerPai.querySelector(".caixa-resultado-busca");
    if (resultadoAntigo) resultadoAntigo.remove();

    // Monta a caixinha de resultados nova
    const caixaResultado = document.createElement("div");
    caixaResultado.className = "caixa-resultado-busca";
    caixaResultado.style.marginTop = "15px";
    caixaResultado.style.padding = "15px";
    caixaResultado.style.backgroundColor = "#ffffff";
    caixaResultado.style.borderRadius = "6px";
    caixaResultado.style.boxShadow = "0 2px 5px rgba(0,0,0,0.05)";
    caixaResultado.style.border = "1px solid #e1e4e8";

    if (lista.length === 0) {
        caixaResultado.innerHTML = `<p style="color: #586069; margin: 0; font-size: 14px;">❌ Nenhum preço encontrado para essa busca.</p>`;
    } else {
        let tabela = `
            <table style="width: 100%; border-collapse: collapse; font-family: sans-serif; font-size: 14px;">
                <thead>
                    <tr style="border-bottom: 2px solid #e1e4e8; color: #586069; text-align: left;">
                        <th style="padding-bottom: 6px;">Supermercado / Produto</th>
                        <th style="text-align: right; padding-bottom: 6px;">Preço</th>
                    </tr>
                </thead>
                <tbody>
        `;

        lista.forEach(item => {
            // Formata a data de AAAA-MM-DD para DD/MM/AAAA
            const dataFormatada = item.data.split('-').reverse().join('/');
            
            tabela += `
                <tr style="border-bottom: 1px solid #f1f1f3;">
                    <td style="padding: 10px 0;">
                        <span style="font-weight: bold; color: #24292e;">${item.estabelecimento}</span><br>
                        <span style="font-size: 12px; color: #586069;">${item.produto} (Coleta: ${dataFormatada})</span>
                    </td>
                    <td style="text-align: right; font-weight: bold; color: #2ea44f; white-space: nowrap;">
                        R$ ${item.preco.toFixed(2).replace('.', ',')}
                    </td>
                </tr>
            `;
        });

        tabela += `</tbody></table>`;
        caixaResultado.innerHTML = tabela;
    }

    // Insere os resultados logo abaixo do botão "Buscar" clicado
    containerPai.appendChild(caixaResultado);
}
</script>

          </body>
          </html>
